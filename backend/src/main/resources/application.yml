spring:
  config:
    import: optional:file:.env.properties # read environment variables from .env file
  application:
    name: e-wallet
  main:
    banner-mode: console
  banner:
    location: classpath:/banner.txt
  output:
    ansi:
      enabled: always
  jackson:
    date-format: 'dd.MM.yyyy'
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/${db_name}
    username: ${db_username}
    password: ${db_password}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate.format_sql: true
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      open-in-view: false
      generate-ddl: true
  flyway:
    enabled: true
    placeholderReplacement: false
    baseline-on-migrate: true
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 10MB

logging:
  file:
    name: './logs/application.log'
    logback:
      rollingpolicy:
        max-file-size: 1MB
        total-size-cap: 10MB
        max-history: 30
        clean-history-on-start: true
  pattern:
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){blue} %clr(%-5p) %clr(${PID}){faint} %clr(---){faint} %clr([%8.15t]){faint} %clr(%-40.40logger{0}){cyan} %clr(:){faint} %clr(%m){faint}%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  level:
    com.github.yildizmy: debug
    org.springframework: warn
    org.hibernate: error
    org.springframework.security: error

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

exception:
  trace: true

app:
  payment:
    momo:
      enabled: ${MOMO_ENABLED:false}
      create-url: ${MOMO_CREATE_URL:https://test-payment.momo.vn/v2/gateway/api/create}
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      redirect-url: ${MOMO_REDIRECT_URL:https://localhost/top-up}
      ipn-url: ${MOMO_IPN_URL:https://localhost/api/v1/webhooks/momo}
      connect-timeout: ${MOMO_CONNECT_TIMEOUT:5s}
      read-timeout: ${MOMO_READ_TIMEOUT:30s}
  inventory:
    crypto:
      active-key-version: ${INVENTORY_ACTIVE_KEY_VERSION}
      keyring: ${INVENTORY_KEYRING}
      checksum-key: ${INVENTORY_CHECKSUM_KEY}
  security:
    jwtSecret: ${jwt_secret}
    jwtExpirationMs: 3600000
    headers:
      enabled: ${APP_SECURITY_HEADERS_ENABLED:true}
      content-security-policy: ${APP_SECURITY_CSP:default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'}
      frame-options: ${APP_SECURITY_FRAME_OPTIONS:DENY}
      referrer-policy: ${APP_SECURITY_REFERRER_POLICY:no-referrer}
      hsts-enabled: ${APP_SECURITY_HSTS_ENABLED:false}
      hsts-include-sub-domains: ${APP_SECURITY_HSTS_INCLUDE_SUBDOMAINS:true}
      hsts-preload: ${APP_SECURITY_HSTS_PRELOAD:false}
      hsts-max-age-seconds: ${APP_SECURITY_HSTS_MAX_AGE_SECONDS:31536000}
      trust-forwarded-proto: ${APP_SECURITY_TRUST_FORWARDED_PROTO:false}
    rate-limit:
      enabled: ${APP_SECURITY_RATE_LIMIT_ENABLED:true}
      window: ${APP_SECURITY_RATE_LIMIT_WINDOW:60s}
      login-per-window: ${APP_SECURITY_RATE_LIMIT_LOGIN:5}
      signup-per-window: ${APP_SECURITY_RATE_LIMIT_SIGNUP:3}
      refresh-per-window: ${APP_SECURITY_RATE_LIMIT_REFRESH:10}
      logout-per-window: ${APP_SECURITY_RATE_LIMIT_LOGOUT:10}
      checkout-per-window: ${APP_SECURITY_RATE_LIMIT_CHECKOUT:20}
      reveal-per-window: ${APP_SECURITY_RATE_LIMIT_REVEAL:20}
      webhook-per-window: ${APP_SECURITY_RATE_LIMIT_WEBHOOK:60}
      max-entries: ${APP_SECURITY_RATE_LIMIT_MAX_ENTRIES:10000}
  observability:
    low-stock-threshold: ${APP_OBSERVABILITY_LOW_STOCK_THRESHOLD:1}
    low-stock-refresh: ${APP_OBSERVABILITY_LOW_STOCK_REFRESH:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

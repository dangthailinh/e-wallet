name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  # These are disposable CI-only values, never production credentials.
  db_name: e_wallet_ci
  db_username: ewallet_ci
  db_password: ci-only-password
  jwt_secret: ci-only-jwt-secret-with-at-least-32-bytes
  INVENTORY_ACTIVE_KEY_VERSION: "1"
  INVENTORY_KEYRING: "1:Y2ktb25seS1rZXktMzItYnl0ZXMtYWJjZGVmMTIzNDU="
  INVENTORY_CHECKSUM_KEY: "Y2ktb25seS1jaGVja3N1bS0zMi1ieXRlcy0xMjM0NTY="
  MOMO_ENABLED: "false"

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.6-alpine
        env:
          POSTGRES_DB: e_wallet_ci
          POSTGRES_USER: ewallet_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ewallet_ci -d e_wallet_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --run
      - name: Production build
        run: npm run build

  e2e:
    name: Browser smoke tests
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit npm dependencies
        id: npm-audit
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          status=$?
          test -s npm-audit.json || printf '%s\n' '{}' > npm-audit.json
          exit "$status"
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: frontend/npm-audit.json
          if-no-files-found: error
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Container build and scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag e-wallet-backend:ci ./backend
      - name: Build frontend image
        run: docker build --tag e-wallet-frontend:ci ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: e-wallet-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: e-wallet-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scans
          path: '*.sarif'
          if-no-files-found: ignore
